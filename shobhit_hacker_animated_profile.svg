<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1600 900"
     width="1600" height="900"
     preserveAspectRatio="xMidYMid meet">

  <title>Shobhit Yadav — Hacker Developer Profile</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02050a"/>
      <stop offset=".5" stop-color="#06111a"/>
      <stop offset="1" stop-color="#010207"/>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00eaff"/>
      <stop offset=".5" stop-color="#35ff7d"/>
      <stop offset="1" stop-color="#00eaff"/>
    </linearGradient>

    <radialGradient id="centerGlow">
      <stop offset="0" stop-color="#00eaff" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#00ff88" stop-opacity=".08"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00eaff" stroke-opacity=".055"/>
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
      .sans{font-family:Inter,Segoe UI,Arial,sans-serif}
      .white{fill:#effaff}
      .cyan{fill:#00eaff}
      .green{fill:#35ff7d}
      .muted{fill:#8ca5b3}
      .panel{fill:#030b12;fill-opacity:.88;stroke:#00eaff;stroke-opacity:.62;stroke-width:2}
      .title{font-size:54px;font-weight:900;letter-spacing:2px}
      .head{font-size:28px;font-weight:900;letter-spacing:2px}
      .body{font-size:21px}
      .skill{font-size:20px;font-weight:700}
    </style>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="805" cy="445" rx="510" ry="430" fill="url(#centerGlow)">
    <animate attributeName="opacity" values=".55;1;.55" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ANIMATED SCAN LINE -->
  <rect x="0" y="0" width="1600" height="3" fill="#35ff7d" opacity=".65" filter="url(#glow)">
    <animate attributeName="y" values="0;897;0" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- TOP TERMINAL -->
  <g transform="translate(38 30)">
    <text class="mono" font-size="25" fill="#35ff7d">$ shobhit@kali:~$</text>
    <text x="0" y="35" class="mono" font-size="24" fill="#00eaff">/learn--build-repeat</text>
    <text x="0" y="68" class="mono" font-size="19" fill="#8ca5b3">
      <tspan fill="#35ff7d">●</tspan> status:
      <tspan fill="#35ff7d" font-weight="900"> ONLINE</tspan> coding mode
    </text>
  </g>

  <!-- LEFT KNOWLEDGE -->
  <g transform="translate(35 155)">
    <path class="panel" d="M0 22L22 0H470L492 22V310L470 332H22L0 310Z"/>
    <text x="30" y="48" class="sans head cyan">KNOWLEDGE</text>
    <path d="M300 42H458" stroke="#00eaff" stroke-width="3"/>
    <path d="M350 51H430" stroke="#35ff7d" stroke-width="2"/>

    <g class="sans skill white">
      <text x="30" y="100">✦ <tspan dx="12">Complete Science</tspan></text>
      <text x="30" y="148">✦ <tspan dx="12">IT Tools &amp; Networking</tspan></text>
      <text x="30" y="196">✦ <tspan dx="12">Web Designing</tspan></text>
      <text x="30" y="244">✦ <tspan dx="12">Frontend Development</tspan></text>
      <text x="30" y="292">✦ <tspan dx="12">Cyber Security &amp; Ethical Hacking</tspan></text>
    </g>

    <circle cx="450" cy="286" r="4" fill="#35ff7d" filter="url(#glow)">
      <animate attributeName="r" values="3;7;3" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- LEFT TECHNOLOGY -->
  <g transform="translate(35 520)">
    <path class="panel" d="M0 22L22 0H470L492 22V270L470 292H22L0 270Z"/>
    <text x="30" y="48" class="sans head cyan">TECHNOLOGY</text>

    <g class="sans" font-weight="900" text-anchor="middle">
      <g transform="translate(82 105)">
        <rect x="-48" y="-28" width="96" height="58" rx="10" fill="#101820" stroke="#ff693d"/>
        <text y="8" font-size="22" fill="#ff693d">HTML</text>
      </g>
      <g transform="translate(190 105)">
        <rect x="-48" y="-28" width="96" height="58" rx="10" fill="#101820" stroke="#3280ff"/>
        <text y="8" font-size="22" fill="#3280ff">CSS</text>
      </g>
      <g transform="translate(315 105)">
        <rect x="-60" y="-28" width="120" height="58" rx="10" fill="#101820" stroke="#ffd43b"/>
        <text y="8" font-size="21" fill="#ffd43b">JavaScript</text>
      </g>
      <g transform="translate(415 105)">
        <rect x="-38" y="-28" width="76" height="58" rx="10" fill="#101820" stroke="#ff5b3d"/>
        <text y="8" font-size="21" fill="#ff5b3d">Git</text>
      </g>

      <g transform="translate(82 190)">
        <rect x="-48" y="-28" width="96" height="58" rx="10" fill="#101820" stroke="#f5fbff"/>
        <text y="8" font-size="20" fill="#f5fbff">GitHub</text>
      </g>
      <g transform="translate(205 190)">
        <rect x="-48" y="-28" width="96" height="58" rx="10" fill="#101820" stroke="#ffd43b"/>
        <text y="8" font-size="21" fill="#ffd43b">Linux</text>
      </g>
      <g transform="translate(330 190)">
        <rect x="-55" y="-28" width="110" height="58" rx="10" fill="#101820" stroke="#35ff7d"/>
        <text y="8" font-size="21" fill="#35ff7d">Python</text>
      </g>
    </g>
  </g>

