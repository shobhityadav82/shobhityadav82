  <!-- FOOTER -->
  <rect y="850" width="1600" height="50" fill="#02060b" stroke="#00eaff" stroke-opacity=".35"/>
  <text x="35" y="882" class="mono" font-size="17" fill="#35ff7d">
    LEARN • EXPLORE • GROW
  </text>
  <text x="625" y="882" class="mono" font-size="17" fill="#00eaff">
    /SHOBHIT DEV
  </text>
  <text x="1280" y="882" class="mono" font-size="17" fill="#35ff7d">
    @shobhityadav82
  </text>

