    <circle r="245" fill="none" stroke="#00eaff" stroke-opacity=".28"
            stroke-width="3" stroke-dasharray="70 20">
      <animateTransform attributeName="transform" type="rotate"
                        from="360" to="0" dur="11s" repeatCount="indefinite"/>
    </circle>

    <!-- ASCII HOODED HACKER -->
    <g class="mono" text-anchor="middle" font-weight="900" font-size="16">
      <text y="-190" fill="#00eaff">.::;ii11';.      .::i11;.      .^l0.</text>
      <text y="-170" fill="#35ff7d">   .8888&quot;       88888888.     888</text>
      <text y="-150" fill="#00eaff"> .8888&quot; .::888  8888. 8888.  .888</text>
      <text y="-130" fill="#35ff7d">88888.  .:8888  8888.  8888  .8888</text>
      <text y="-110" fill="#00eaff">88888  8888888  88888  8888  88888</text>
      <text y="-90"  fill="#35ff7d">88888  8888888  8888888 8888 88888</text>
      <text y="-70"  fill="#00eaff">88888   88888    888888  888 88888</text>
      <text y="-50"  fill="#35ff7d"> 8888    8888     88888   88 8888</text>
      <text y="-30"  fill="#00eaff">   88    8888      8888      888</text>
      <text y="-10"  fill="#35ff7d">    88888888888888888888888888</text>
      <text y="10"   fill="#00eaff">      8888888888888888888888</text>
      <text y="30"   fill="#35ff7d">       8888    8888    8888</text>
      <text y="50"   fill="#00eaff">      8888     8888     8888</text>
      <text y="70"   fill="#35ff7d">    88888      8888      88888</text>
      <text y="90"   fill="#00eaff">  888888      888888      888888</text>
      <text y="110"  fill="#35ff7d">8888888888   88888888   888888888</text>
      <text y="130"  fill="#00eaff">888888888888888888888888888888888</text>
      <text y="150"  fill="#35ff7d">888888888888888888888888888888888</text>
      <text y="170"  fill="#00eaff">  88888888888888888888888888888</text>

      <animate attributeName="opacity"
               values=".65;1;.65" dur="2.2s" repeatCount="indefinite"/>
    </g>

    <!-- EYES -->
    <g fill="#35ff7d" filter="url(#bigGlow)">
      <path d="M-72 -4Q-38-32-5-4Q-38 20-72-4Z"/>
      <path d="M5-4Q38-32 72-4Q38 20 5-4Z"/>
      <animate attributeName="opacity" values=".55;1;.55" dur="1.4s" repeatCount="indefinite"/>
    </g>

    <!-- CENTER CODE TERMINAL -->
    <g transform="translate(-270 205)">
      <rect width="540" height="128" rx="15" fill="#02080d"
            stroke="#35ff7d" stroke-width="3" filter="url(#glow)"/>
      <text x="20" y="32" class="mono" font-size="18" fill="#00eaff">&gt;_ const future = ["learn", "build", "hack"];</text>
      <text x="20" y="62" class="mono" font-size="18" fill="#35ff7d">while (dreams) { code(); }</text>
      <text x="20" y="92" class="mono" font-size="18" fill="#ffd43b">console.log("KEEP GOING");</text>
      <text x="20" y="116" class="mono" font-size="16" fill="#b66cff">/SHOBHIT DEV  •  @shobhityadav82</text>
      <rect x="20" y="39" width="3" height="18" fill="#00eaff">
        <animate attributeName="opacity" values="1;0;1" dur=".8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- RIGHT QUOTE -->
  <g transform="translate(1190 55)">
    <path class="panel" d="M0 25L25 0H365L390 25V185L365 210H25L0 185Z"/>
    <text x="30" y="58" font-size="52" fill="#35ff7d">“</text>
    <text x="72" y="65" class="sans" font-size="20" fill="#effaff">Not just a user,</text>
    <text x="72" y="96" class="sans" font-size="20" fill="#effaff">I'm a creator of my</text>
    <text x="72" y="127" class="sans" font-size="20" fill="#effaff">own future.</text>
    <text x="330" y="162" font-size="52" fill="#35ff7d">”</text>
  </g>

  <!-- RIGHT GITHUB -->
  <g transform="translate(1190 290)">
    <path class="panel" d="M0 25L25 0H365L390 25V315L365 340H25L0 315Z"/>
    <text x="30" y="55" class="sans head cyan">GITHUB</text>
    <rect x="30" y="78" width="300" height="48" rx="24"
          fill="#031016" stroke="#35ff7d" stroke-width="2"/>
    <text x="180" y="109" text-anchor="middle" class="mono"
          font-size="20" fill="#35ff7d">@shobhityadav82</text>

    <g class="sans body white">
      <text x="35" y="165">◉  Followers : 0</text>
      <text x="35" y="207">◉  Following : 0</text>
      <text x="35" y="249">◉  Public Repos : 0</text>
      <text x="35" y="291">◉  Contributions : 0</text>
    </g>

    <text x="35" y="322" class="sans" font-size="17" fill="#35ff7d">
      Build • Commit • Grow
    </text>
  </g>

  <!-- RIGHT CODE / SIGNATURE -->
  <g transform="translate(1190 665)">
    <text x="0" y="30" class="mono" font-size="19" fill="#00eaff">CODE • LEARN • BUILD • REPEAT</text>
    <text x="0" y="80" class="sans" font-size="39" font-weight="900"
          fill="#35ff7d">Shobhit Yadav</text>
    <path d="M0 94Q150 65 365 90" fill="none" stroke="#00eaff" stroke-width="3"/>
  </g>

  <!-- ANIMATED PARTICLES -->
  <g fill="#35ff7d" filter="url(#glow)">
    <circle cx="550" cy="120" r="3">
      <animate attributeName="cy" values="120;160;120" dur="1.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1070" cy="170" r="4">
      <animate attributeName="opacity" values=".2;1;.2" dur="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1130" cy="610" r="3">
      <animate attributeName="r" values="2;6;2" dur="1.5s" repeatCount="indefinite"/>
